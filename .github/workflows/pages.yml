# Publishes the prebuilt static site in archive/ to GitHub Pages.
# The site is built locally (python tools/build_archive.py) because the build
# needs the raw sources/ folder, which is not in the repository.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["archive/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: archive
      - id: deployment
        uses: actions/deploy-pages@v4
